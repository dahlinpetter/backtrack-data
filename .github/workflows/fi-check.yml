name: Finland check (VR commuter 10% rule)
on:
  workflow_dispatch:
    inputs:
      start: {default: "2025-12-01"}
      end: {default: "2026-11-27"}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python tools/fi_check.py "${{ inputs.start }}" "${{ inputs.end }}"
      - name: Save
        run: |
          git config user.name delay-bot; git config user.email delay-bot@users.noreply.github.com
          git add data/fi; git commit -qm "fi check ${{ inputs.start }}..${{ inputs.end }} [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break || sleep 5; done
