name: Trafiklab stop lookup
on:
  workflow_dispatch:
    inputs:
      names: {default: "Eslöv,Höör,Hässleholm,Osby,Älmhult"}
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - env: {TRAFIKLAB_KEY: "${{ secrets.TRAFIKLAB_KEY }}", NAMES: "${{ inputs.names }}"}
        run: IFS=, read -ra A <<< "$NAMES"; python tools/stop_lookup.py "${A[@]}"
