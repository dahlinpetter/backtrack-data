name: Debug departures
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - env: { K: "${{ secrets.TRAFIKLAB_KEY }}" }
        run: |
          curl -s "https://realtime-api.trafiklab.se/v1/departures/860000626?key=$K" | jq -r '.departures[] | select(.route.transport_mode=="TRAIN") | [.scheduled[11:16], (.realtime//"")[11:16], .agency.name, .route.direction, .trip.technical_number, "sched:" + (.scheduled_platform.designation // "-"), "real:" + (.realtime_platform.designation // "-")] | @tsv' | head -12
