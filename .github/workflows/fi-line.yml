name: Finland line lookup
on:
  workflow_dispatch:
    inputs:
      line: {default: "V"}
      day: {default: "2026-11-20"}
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python tools/fi_line.py "${{ inputs.line }}" "${{ inputs.day }}"
