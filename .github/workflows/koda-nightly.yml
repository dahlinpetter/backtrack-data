name: Nightly history (KoDa)
on:
  schedule:
    # twice a day (backup; the server also starts this job): fetch any missing day from the last 30 days (the archive can lag, in Nov 2026 by over two weeks)
    - cron: "20 3 * * *"
    - cron: "20 11 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: koda
jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install gtfs-realtime-bindings==1.0.0 protobuf && sudo apt-get install -y p7zip-full >/dev/null
      - name: Fetch missing days from the last 30 days
        env:
          KODA_KEY: ${{ secrets.KODA_KEY }}
        run: |
          START=$(date -u -d '30 days ago' +%F); END=$(date -u -d 'yesterday' +%F)
          python tools/koda_backfill.py --start "$START" --end "$END" --hours 0-23 --max-minutes 45
          python tools/page_history.py
          python tools/by_hour.py
      - name: Save
        if: always()
        run: |
          git config user.name "delay-bot"
          git config user.email "delay-bot@users.noreply.github.com"
          git add data/history.json data/history_progress.json data/page_history.json data/by_hour.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "history: nightly KoDa"
          git checkout -B main 2>/dev/null || true
          # retry on a busy repo or a GitHub hiccup; "|| true" matters: under bash -e a failing rebase --abort would end the job on the first try
          ok=; for i in 1 2 3; do if (git pull --rebase -q origin main && git push -q origin HEAD:main); then ok=1; break; fi; git rebase --abort 2>/dev/null || true; sleep 5; done; [ -n "$ok" ] || { echo "::error::push failed 3 times"; exit 1; }
