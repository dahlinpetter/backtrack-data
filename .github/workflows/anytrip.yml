name: Any trip (all trains, Trafikverket)
on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to fetch (backfill)"
        required: false
        default: "1"
      force:
        description: "Re-fetch days already saved (1 = yes)"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: anytrip
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch every train from Trafikverket
        env:
          TRAFIKVERKET_KEY: ${{ secrets.TRAFIKVERKET_KEY }}
          FORCE: ${{ inputs.force || '' }}
        run: |
          python tools/anytrip.py "${{ inputs.days || '1' }}"
          python tools/health.py
      - name: Save
        run: |
          git config user.name "delay-bot"
          git config user.email "delay-bot@users.noreply.github.com"
          git add -A data/anytrip data/health.json data/recent_extra.json
          git diff --cached --quiet && exit 0
          git commit -qm "anytrip: $(date -u +%FT%TZ) [skip ci]"
          # retry on a busy repo or a GitHub hiccup; "|| true" matters: under bash -e a failing rebase --abort would end the job on the first try
          ok=; for i in 1 2 3 4; do if (git pull --rebase -X theirs -q origin main && git push -q origin HEAD:main); then ok=1; break; fi; git rebase --abort 2>/dev/null || true; sleep 7; done; [ -n "$ok" ] || { echo "::error::push failed 4 times"; exit 1; }
