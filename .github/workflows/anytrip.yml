name: Any trip (all trains, Trafikverket)
on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to fetch (backfill)"
        required: false
        default: "1"
permissions:
  contents: write
concurrency:
  group: anytrip
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch every train from Trafikverket
        env:
          TRAFIKVERKET_KEY: ${{ secrets.TRAFIKVERKET_KEY }}
        run: |
          python tools/anytrip.py "${{ inputs.days || '1' }}"
          python tools/health.py
      - name: Save
        run: |
          git config user.name "delay-bot"
          git config user.email "delay-bot@users.noreply.github.com"
          git add -A data/anytrip data/health.json
          git diff --cached --quiet && exit 0
          git commit -qm "anytrip: $(date -u +%FT%TZ) [skip ci]"
          for i in 1 2 3 4; do (git pull --rebase -X theirs -q origin main && git push -q origin HEAD:main) && break || (git rebase --abort 2>/dev/null; sleep 7); done
