name: Collect arrivals in Denmark (all day, every day)
# Trafikverket only reports Swedish stations, so real arrival times at Kastrup, Ørestad and København H
# come from Trafiklab's boards. 3 calls every 20 minutes. anytrip.py swaps them in for its estimates.
on:
  schedule:
    - cron: "3,23,43 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 40
      # GitHub's own schedule is a backup for the server, which starts this job at the same minutes; when GitHub's
      # schedule runs late it can land right on a server run (26 Nov: 23 seconds apart). Skip if that just happened.
      - name: Skip if this just ran
        id: dedupe
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct --grep='^data dk:' || true); age=$(( $(date +%s) - ${last:-0} ))
          if [ "$age" -lt 480 ]; then echo "Collected ${age}s ago, skipping."; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.dedupe.outputs.skip != '1'
        with:
          python-version: "3.12"
      - name: Fetch arrivals at the Danish stations
        if: steps.dedupe.outputs.skip != '1'
        env:
          TRAFIKLAB_KEY: ${{ secrets.TRAFIKLAB_KEY }}
          ONLY_STATIONS: "Kastrup,Ørestad,København H"
          ONLY_KIND: arr
        run: |
          python collect.py
          python export_delays.py
      - name: Save data
        if: steps.dedupe.outputs.skip != '1'
        env:
          TRAFIKLAB_KEY: ${{ secrets.TRAFIKLAB_KEY }}
          ONLY_STATIONS: "Kastrup,Ørestad,København H"
          ONLY_KIND: arr
        run: tools/save.sh "data dk" "data/observations data/delays.json data/stations.json" "python collect.py && python export_delays.py"
